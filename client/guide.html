<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      No user-scalable=no here, unlike the game. The board must not zoom under a
      double-tap mid-match; a page of text must be zoomable, and taking that
      away from anyone who needs it to read is not a trade this page has to make.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e2432" />
    <title>Field Guide — Clash of Pokémon</title>
    <!--
      In the head as well as on the page, so it is in the source and in the
      search result rather than only in the rendering. A rights holder looking
      at this should find the answer before they have to ask.
    -->
    <meta
      name="copyright"
      content="Pokémon © 1995–2026 Nintendo / Creatures Inc. / GAME FREAK inc. Non-commercial fan project, not affiliated with or endorsed by the rights holders."
    />

    <meta name="description" content="How Clash of Pokémon works: elixir, towers, deploying, types, evolution, and every Pokémon in the game." />
    <link rel="canonical" href="https://www.clashofpokemon.online/guide" />

    <!--
      What a shared link looks like. Without these a pasted URL is a bare
      string in every chat window, which is most of how a game like this
      travels.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clash of Pokémon" />
    <meta property="og:title" content="Field Guide — Clash of Pokémon" />
    <meta property="og:description" content="Elixir, towers, types, evolution, and every Pokémon in the game." />
    <meta property="og:url" content="https://www.clashofpokemon.online/guide" />
    <meta property="og:image" content="https://www.clashofpokemon.online/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A lane battle in Clash of Pokémon: two towers, a river, and creatures crossing a bridge." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Field Guide — Clash of Pokémon" />
    <meta name="twitter:description" content="Elixir, towers, types, evolution, and every Pokémon in the game." />
    <meta name="twitter:image" content="https://www.clashofpokemon.online/og.png" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/guide.css" />
  </head>
  <body>
    <div id="guide"></div>
    <script type="module" src="/src/guide/main.tsx"></script>
  </body>
</html>
