<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover so the board reaches under an iPhone notch, and
      user-scalable=no so a double-tap during a match does not zoom the page.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0e" />
    <title>Clash of Pokémon</title>
    <!--
      In the head as well as on the page, so it is in the source and in the
      search result rather than only in the rendering. A rights holder looking
      at this should find the answer before they have to ask.
    -->
    <meta
      name="copyright"
      content="Pokémon © 1995–2026 Nintendo / Creatures Inc. / GAME FREAK inc. Non-commercial fan project, not affiliated with or endorsed by the rights holders."
    />

    <meta name="description" content="Play Clash of Pokémon in your browser: a real-time lane battler with 151 Pokémon cards, elixir, towers and type matchups. No download." />
    <link rel="canonical" href="https://www.clashofpokemon.online/play" />

    <!--
      What a shared link looks like. Without these a pasted URL is a bare
      string in every chat window, which is most of how a game like this
      travels.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clash of Pokémon" />
    <meta property="og:title" content="Play Clash of Pokémon" />
    <meta property="og:description" content="A real-time Pokémon lane battler. Two players, three minutes, two bridges." />
    <meta property="og:url" content="https://www.clashofpokemon.online/play" />
    <meta property="og:image" content="https://www.clashofpokemon.online/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A lane battle in Clash of Pokémon: two towers, a river, and creatures crossing a bridge." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Play Clash of Pokémon" />
    <meta name="twitter:description" content="A real-time Pokémon lane battler. Two players, three minutes, two bridges." />
    <meta name="twitter:image" content="https://www.clashofpokemon.online/og.png" />
    <link rel="stylesheet" href="/fonts.css" />
    <!-- Dialogs and popups are DOM; see src/ui/modal.ts for why. -->
    <link rel="stylesheet" href="/ui.css" />
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: #0b0b0e;
        /* No text is drawn by the DOM -- this only affects the loading state. */
        color: #cfcfd6;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        /* Stops the pull-to-refresh gesture firing when you drag a card down. */
        overscroll-behavior: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game { width: 100vw; height: 100dvh; }
      /* Force the face to load before Phaser measures anything. */
      .font-preload { position: absolute; left: -9999px; font-family: "PokemonClassic"; }
      #game canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <span class="font-preload">.</span>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
