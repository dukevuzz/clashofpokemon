name: deploy

on:
  workflow_dispatch:
  push: { tags: ['v*'] }

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25, cache: maven }

      # The jar is bytecode, so it is built once here and the arm64 image is
      # only a COPY -- no emulation, no cross-compiling.
      - run: ./mvnw -B package -DskipTests
        working-directory: server
      - run: ./mvnw -B package -DskipTests
        working-directory: api

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/clashofpokemon-server:${{ github.sha }},${{ env.REGISTRY }}/${{ github.repository_owner }}/clashofpokemon-server:latest
      - uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/clashofpokemon-api:${{ github.sha }},${{ env.REGISTRY }}/${{ github.repository_owner }}/clashofpokemon-api:latest

  server:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: pull and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ~/clashofpokemon/deploy
            echo "TAG=${{ github.sha }}" > .tag
            docker compose pull
            # Compose waits stop_grace_period (250s) for the match loop to
            # drain, so a deploy does not cut games in progress.
            docker compose up -d

  # Cloudflare Pages builds and serves the client, and the sprite atlases with
  # it -- so the box never serves a byte of art.
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          VITE_API: ${{ vars.API_URL }}
          VITE_GAME_SERVER: ${{ vars.GAME_URL }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy client/dist --project-name=clashofpokemon
