name: deploy

on:
  workflow_dispatch:
  push: { tags: ['v*'] }

env:
  # Docker Hub rather than ghcr: a private repository makes its ghcr packages
  # private too, and the box would need a registry login just to pull.
  REGISTRY: docker.io
  NAMESPACE: ducvu123

jobs:
  images:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25, cache: maven }

      # The jar is bytecode, so it is built once here and the arm64 image is
      # only a COPY -- no emulation, no cross-compiling.
      - run: ./mvnw -B package -DskipTests
        working-directory: server
      - run: ./mvnw -B package -DskipTests
        working-directory: api

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.NAMESPACE }}/clashofpokemon-server:${{ github.sha }},${{ env.NAMESPACE }}/clashofpokemon-server:latest
      - uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.NAMESPACE }}/clashofpokemon-api:${{ github.sha }},${{ env.NAMESPACE }}/clashofpokemon-api:latest
