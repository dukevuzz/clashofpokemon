spring.application.name=clashofpokemon-server

# The port the client looks for. Kept because the client is already built
# against it: `serverBase()` in phaser/src/net/session.ts says 4400, and a
# server that moved would simply never be found.
server.port=${PORT:4400}

# Where the meta tier lives: it signs the tickets this server verifies, and
# keeps the match results this server reports. Same host in production, a port
# away in development.
clash.api=${API_URL:http://localhost:4500}
clash.internal-key=${INTERNAL_KEY:test-internal-key}

# One thread per request, and a match is mostly waiting. Virtual threads are
# what make three thousand concurrent matches a scheduling question rather
# than a memory one.
spring.threads.virtual.enabled=true

# Liveness and readiness as separate probes.
#
# Readiness is the deploy signal: a node winding down refuses new traffic while
# staying alive, so the balancer stops sending players and the platform does
# not restart a process that is deliberately leaving. See net/Drain.
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# HTTP requests finish before the server closes. This covers /status and
# /me/match only -- matches are drained by net/Drain, which sockets need and
# this does not do.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=250s

# How many sockets one address may hold at once.
#
# Raise this if anything sits in front of the server, because every player
# then arrives from the same address. Better still, set the flag below so the
# cap counts real clients -- but only set it when a proxy is genuinely there,
# since a client can otherwise put whatever it likes in the header.
# How many sockets node-wide may be unauthenticated at once. The only limit
# that is not per-socket, and the only one worth having: addresses are not
# counted at all, because a mobile carrier shares one between very many real
# players and Cloudflare shares one between all of them.
clash.max-unauthenticated=500
